# Anomaly Therapy — Netlify configuration
# Static site, no build step.

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long cache for images only (these rarely change and aren't structural)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# CSS and JS get short cache + revalidation so site edits show up immediately
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# ---------------------------------------------------------------------------
# Host canonicalization — www → apex, 301, all paths including root.
# Netlify's primary-domain setting already enforces this in production; this
# rule codifies it in the repo so the behavior survives a domain reconfigure.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://www.anomalytherapy.com/*"
  to = "https://anomalytherapy.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Canonical URL enforcement — .html twins 301 to their pretty URL so only one
# indexable version of each page exists. These must precede the pretty-URL
# rewrites below. 404.html is intentionally omitted (it is the error document).
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

