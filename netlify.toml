# Anomaly Therapy — Netlify configuration
# Static site, no build step.

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long cache for static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty-URL redirects (so /services works as well as /services.html)
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/faqs"
  to = "/faqs.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faqs.html"
  status = 301

[[redirects]]
  from = "/media"
  to = "/media.html"
  status = 200

[[redirects]]
  from = "/careers"
  to = "/careers.html"
  status = 200

# Legacy Squarespace path redirects — preserve link equity
[[redirects]]
  from = "/our-team"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/team"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/about-anomaly"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/welcome"
  to = "/"
  status = 301

[[redirects]]
  from = "/book"
  to = "https://anomalytherapy.sessionshealth.com"
  status = 302

[[redirects]]
  from = "/portal"
  to = "https://anomalytherapy.sessionshealth.com"
  status = 302

# 404 fallback (Netlify default behavior, listed for clarity)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
